<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Retention Team Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-light: #293548;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 {
      font-size: 1.3rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }
    .view-switch {
      display: flex;
      gap: 6px;
      background: var(--panel-light);
      padding: 4px;
      border-radius: 8px;
    }
    .view-switch button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all .15s;
    }
    .view-switch button.active {
      background: var(--accent);
      color: #04202e;
    }
    .controls {
      padding: 16px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-right: 6px;
    }
    select {
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.refresh {
      background: var(--accent);
      color: #04202e;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.refresh:hover { opacity: 0.9; }
    main {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .card .label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .card .value {
      font-size: 1.8rem;
      font-weight: 700;
    }
    .card .sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .card.green .value { color: var(--green); }
    .card.red .value { color: var(--red); }
    .card.yellow .value { color: var(--yellow); }
    section.panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
    }
    section.panel h2 {
      margin: 0 0 16px 0;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .pill.ok { background: rgba(34,197,94,0.15); color: var(--green); }
    .pill.bad { background: rgba(239,68,68,0.15); color: var(--red); }
    .loading, .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .table-wrap { overflow-x: auto; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      padding: 20px;
    }
    .agent-select-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="dot"></span> Retention Team Dashboard</h1>
    <div class="view-switch">
      <button id="btnAgentView" class="active">Agent View</button>
      <button id="btnTLView">TL View</button>
    </div>
  </header>

  <div class="controls">
    <div class="agent-select-row" id="agentSelectRow">
      <label>Agent</label>
      <select id="agentSelect"></select>
    </div>
    <div>
      <label>Period Type</label>
      <select id="periodType">
        <option value="monthly">Monthly</option>
        <option value="quarterly">Quarterly</option>
        <option value="annual">Annual</option>
      </select>
    </div>
    <div>
      <label>Period</label>
      <select id="periodValue"></select>
    </div>
    <button class="refresh" id="btnRefresh">Refresh</button>
  </div>

  <main id="mainContent">
    <div class="loading"><div class="spinner"></div>Loading data…</div>
  </main>

  <footer>Retention Team Dashboard · Data source: Google Sheet</footer>

  <script>
    let periodsData = null;
    let currentView = 'agent'; // 'agent' | 'tl'

    document.getElementById('btnAgentView').addEventListener('click', () => switchView('agent'));
    document.getElementById('btnTLView').addEventListener('click', () => switchView('tl'));
    document.getElementById('periodType').addEventListener('change', onPeriodTypeChange);
    document.getElementById('btnRefresh').addEventListener('click', loadCurrentView);
    document.getElementById('agentSelect').addEventListener('change', loadCurrentView);

    function switchView(view) {
      currentView = view;
      document.getElementById('btnAgentView').classList.toggle('active', view === 'agent');
      document.getElementById('btnTLView').classList.toggle('active', view === 'tl');
      document.getElementById('agentSelectRow').style.display = view === 'agent' ? 'flex' : 'none';
      loadCurrentView();
    }

    function onPeriodTypeChange() {
      populatePeriodValues();
      loadCurrentView();
    }

    function populatePeriodValues() {
      const type = document.getElementById('periodType').value;
      const sel = document.getElementById('periodValue');
      sel.innerHTML = '';
      const opts = periodsData[type] || [];
      // default to latest period
      opts.slice().reverse().forEach((o, idx) => {
        const el = document.createElement('option');
        el.value = o.value;
        el.textContent = o.label;
        sel.appendChild(el);
      });
    }

    function getCurrentFilter() {
      return {
        type: document.getElementById('periodType').value,
        value: document.getElementById('periodValue').value
      };
    }

    function init() {
      google.script.run.withSuccessHandler(onPeriodsLoaded).withFailureHandler(onError).getAvailablePeriods();
      google.script.run.withSuccessHandler(onAgentsLoaded).withFailureHandler(onError).getAgentList();
    }

    function onAgentsLoaded(agents) {
      const sel = document.getElementById('agentSelect');
      sel.innerHTML = '<option value="__all__">All Agents</option>';
      agents.forEach(a => {
        const el = document.createElement('option');
        el.value = a;
        el.textContent = a;
        sel.appendChild(el);
      });
    }

    function onPeriodsLoaded(periods) {
      periodsData = periods;
      populatePeriodValues();
      loadCurrentView();
    }

    function onError(err) {
      document.getElementById('mainContent').innerHTML =
        '<div class="empty">⚠️ Error loading data: ' + (err.message || err) + '</div>';
    }

    function loadCurrentView() {
      if (!periodsData) return;
      const filter = getCurrentFilter();
      if (!filter.value) {
        document.getElementById('mainContent').innerHTML = '<div class="empty">No data available for this period type.</div>';
        return;
      }
      document.getElementById('mainContent').innerHTML = '<div class="loading"><div class="spinner"></div>Loading data…</div>';

      if (currentView === 'agent') {
        Promise.all([
          runAsync('getPRIReport', filter),
          runAsync('getContactabilityReport', filter),
          runAsync('getRenewReport', filter)
        ]).then(([pri, contact, renew]) => renderAgentView(pri, contact, renew)).catch(onError);
      } else {
        runAsync('getTLReport', filter).then(renderTLView).catch(onError);
      }
    }

    function runAsync(fnName, arg) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          [fnName](arg);
      });
    }

    function filterByAgent(rows) {
      const sel = document.getElementById('agentSelect').value;
      if (!sel || sel === '__all__') return rows;
      return rows.filter(r => r.agentName === sel);
    }

    function pct(v) { return (v === undefined || v === null) ? '-' : v.toFixed(2) + '%'; }
    function num(v) { return (v === undefined || v === null) ? '-' : v.toLocaleString(); }

    function renderAgentView(pri, contact, renew) {
      pri = filterByAgent(pri);
      contact = filterByAgent(contact);
      renew = filterByAgent(renew);

      let html = '';

      // Summary cards (totals across shown agents)
      const totalCalls = pri.reduce((s, r) => s + r.totalCallsDialed, 0);
      const totalShortfall = pri.reduce((s, r) => s + r.totalCallShortfall, 0);
      const avgContactPct = contact.length ? (contact.reduce((s, r) => s + r.contactedUserCountPct, 0) / contact.length) : 0;
      const avgRenewPct = renew.length ? (renew.reduce((s, r) => s + r.renewUserCountPct, 0) / renew.length) : 0;

      html += '<div class="cards">';
      html += cardHtml('Total Calls Dialed', num(totalCalls), '', 'green');
      html += cardHtml('Total Call Shortfall', num(totalShortfall), 'vs. 200/day target', totalShortfall > 0 ? 'red' : 'green');
      html += cardHtml('Avg Contacted %', pct(avgContactPct), 'Target ≥55%', avgContactPct >= 55 ? 'green' : 'red');
      html += cardHtml('Avg Renew %', pct(avgRenewPct), 'Target ≥55%', avgRenewPct >= 55 ? 'green' : 'red');
      html += '</div>';

      // PRI Table
      html += '<section class="panel"><h2>📞 PRI Call Report</h2><div class="table-wrap"><table>';
      html += '<tr><th>Agent</th><th>Total Calls Dialed</th><th>Working Days</th><th>Avg Calls/Day</th><th>Target/Day</th><th>Expected Total</th><th>Shortfall</th></tr>';
      pri.forEach(r => {
        html += `<tr>
          <td>${esc(r.agentName)}</td>
          <td>${num(r.totalCallsDialed)}</td>
          <td>${num(r.workingDays)}</td>
          <td>${r.avgCallsPerDay}</td>
          <td>${r.targetCallsPerDay}</td>
          <td>${num(r.expectedTotalCalls)}</td>
          <td>${badge(r.totalCallShortfall === 0, num(r.totalCallShortfall))}</td>
        </tr>`;
      });
      if (pri.length === 0) html += emptyRow(7);
      html += '</table></div></section>';

      // Contactability Table
      html += '<section class="panel"><h2>☎️ Inactive User Contactable Calling Report</h2><div class="table-wrap"><table>';
      html += '<tr><th>Agent</th><th>Total User ID Called</th><th>Contacted Count</th><th>Contacted %</th><th>Target (≥55%)</th><th>Shortfall</th><th>Achievement Count</th><th>Achievement %</th></tr>';
      contact.forEach(r => {
        html += `<tr>
          <td>${esc(r.agentName)}</td>
          <td>${num(r.totalUserIdCalled)}</td>
          <td>${num(r.contactedUserCount)}</td>
          <td>${pct(r.contactedUserCountPct)}</td>
          <td>${num(r.targetContactedUserCount)}</td>
          <td>${badge(r.shortfallCount === 0, num(r.shortfallCount))}</td>
          <td>${num(r.achievementCount)}</td>
          <td>${badge(r.achievementPct >= 100, pct(r.achievementPct))}</td>
        </tr>`;
      });
      if (contact.length === 0) html += emptyRow(8);
      html += '</table></div></section>';

      // Renew Table
      html += '<section class="panel"><h2>🔄 Inactive User Renew Report</h2><div class="table-wrap"><table>';
      html += '<tr><th>Agent</th><th>Total User ID Called (Excl. LBO)</th><th>Contacted Renew Count</th><th>Renew %</th><th>Target (≥55%)</th><th>Renew Shortfall</th><th>Achievement Count</th><th>Achievement %</th></tr>';
      renew.forEach(r => {
        html += `<tr>
          <td>${esc(r.agentName)}</td>
          <td>${num(r.totalUserIdCalled)}</td>
          <td>${num(r.contactedRenewUserCount)}</td>
          <td>${pct(r.renewUserCountPct)}</td>
          <td>${num(r.targetRenewUserCount)}</td>
          <td>${badge(r.renewShortfall === 0, num(r.renewShortfall))}</td>
          <td>${num(r.achievementCount)}</td>
          <td>${badge(r.achievementPct >= 100, pct(r.achievementPct))}</td>
        </tr>`;
      });
      if (renew.length === 0) html += emptyRow(8);
      html += '</table></div></section>';

      document.getElementById('mainContent').innerHTML = html;
    }

    function renderTLView(data) {
      let html = '';

      html += '<div class="cards">';
      html += cardHtml('Total User ID Called', num(data.summary.totalUserIdCalled), '', 'green');
      html += cardHtml('Total Calls Dialed', num(data.summary.totalCallsDialed), 'Working Days: ' + num(data.summary.totalWorkingDays), 'green');
      html += cardHtml('Call Shortfall', num(data.summary.callShortfall), 'vs expected ' + num(data.summary.expectedTotalCalls), data.summary.callShortfall > 0 ? 'red' : 'green');
      html += cardHtml('LBO Shifted to Other ISP', num(data.lboShiftedCount), 'Unique User IDs', 'yellow');
      html += '</div>';

      html += '<section class="panel"><h2>📊 Team Performance Summary</h2><div class="table-wrap"><table>';
      html += '<tr><th>Call Type</th><th>Target</th><th>Actual</th><th>Achievement %</th><th>Target − Achievement (Shortfall)</th></tr>';
      html += `<tr>
        <td>Contactable / Contacted</td>
        <td>${data.contactable.target}</td>
        <td>${num(data.contactable.actual)}</td>
        <td>${badge(data.contactable.achievementPct >= 100, pct(data.contactable.achievementPct))}</td>
        <td>${badge(data.contactable.shortfall === 0, num(data.contactable.shortfall))}</td>
      </tr>`;
      html += `<tr>
        <td>Renew / Active</td>
        <td>${data.renew.target}</td>
        <td>${num(data.renew.actual)}</td>
        <td>${badge(data.renew.achievementPct >= 100, pct(data.renew.achievementPct))}</td>
        <td>${badge(data.renew.shortfall === 0, num(data.renew.shortfall))}</td>
      </tr>`;
      html += '</table></div></section>';

      // Agent breakdown tables (reuse same rendering logic)
      html += '<section class="panel"><h2>👥 Agent Breakdown — PRI Call Report</h2><div class="table-wrap"><table>';
      html += '<tr><th>Agent</th><th>Total Calls Dialed</th><th>Working Days</th><th>Avg Calls/Day</th><th>Target/Day</th><th>Expected Total</th><th>Shortfall</th></tr>';
      data.agentBreakdown.pri.forEach(r => {
        html += `<tr>
          <td>${esc(r.agentName)}</td>
          <td>${num(r.totalCallsDialed)}</td>
          <td>${num(r.workingDays)}</td>
          <td>${r.avgCallsPerDay}</td>
          <td>${r.targetCallsPerDay}</td>
          <td>${num(r.expectedTotalCalls)}</td>
          <td>${badge(r.totalCallShortfall === 0, num(r.totalCallShortfall))}</td>
        </tr>`;
      });
      if (data.agentBreakdown.pri.length === 0) html += emptyRow(7);
      html += '</table></div></section>';

      html += '<section class="panel"><h2>👥 Agent Breakdown — Contactability</h2><div class="table-wrap"><table>';
      html += '<tr><th>Agent</th><th>Total User ID Called</th><th>Contacted Count</th><th>Contacted %</th><th>Target (≥55%)</th><th>Shortfall</th><th>Achievement %</th></tr>';
      data.agentBreakdown.contactability.forEach(r => {
        html += `<tr>
          <td>${esc(r.agentName)}</td>
          <td>${num(r.totalUserIdCalled)}</td>
          <td>${num(r.contactedUserCount)}</td>
          <td>${pct(r.contactedUserCountPct)}</td>
          <td>${num(r.targetContactedUserCount)}</td>
          <td>${badge(r.shortfallCount === 0, num(r.shortfallCount))}</td>
          <td>${badge(r.achievementPct >= 100, pct(r.achievementPct))}</td>
        </tr>`;
      });
      if (data.agentBreakdown.contactability.length === 0) html += emptyRow(7);
      html += '</table></div></section>';

      html += '<section class="panel"><h2>👥 Agent Breakdown — Renew Report</h2><div class="table-wrap"><table>';
      html += '<tr><th>Agent</th><th>Total User ID Called</th><th>Contacted Renew</th><th>Renew %</th><th>Target (≥55%)</th><th>Shortfall</th><th>Achievement %</th></tr>';
      data.agentBreakdown.renew.forEach(r => {
        html += `<tr>
          <td>${esc(r.agentName)}</td>
          <td>${num(r.totalUserIdCalled)}</td>
          <td>${num(r.contactedRenewUserCount)}</td>
          <td>${pct(r.renewUserCountPct)}</td>
          <td>${num(r.targetRenewUserCount)}</td>
          <td>${badge(r.renewShortfall === 0, num(r.renewShortfall))}</td>
          <td>${badge(r.achievementPct >= 100, pct(r.achievementPct))}</td>
        </tr>`;
      });
      if (data.agentBreakdown.renew.length === 0) html += emptyRow(7);
      html += '</table></div></section>';

      document.getElementById('mainContent').innerHTML = html;
    }

    function cardHtml(label, value, sub, cls) {
      return `<div class="card ${cls || ''}">
        <div class="label">${label}</div>
        <div class="value">${value}</div>
        ${sub ? '<div class="sub">' + sub + '</div>' : ''}
      </div>`;
    }

    function badge(isGood, text) {
      return '<span class="pill ' + (isGood ? 'ok' : 'bad') + '">' + text + '</span>';
    }

    function emptyRow(colspan) {
      return '<tr><td colspan="' + colspan + '" style="text-align:center;color:var(--muted);">No data for this period</td></tr>';
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Retention Team Dashboard</title>
  <style>
    :root {
      --bg: #0f1420;
      --panel: #161d2e;
      --panel2: #1c2438;
      --border: #2a3348;
      --text: #e8ecf5;
      --muted: #8b95ab;
      --accent: #4f8cff;
      --green: #2ecc8f;
      --red: #ff5d6c;
      --amber: #ffb84f;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .topbar h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 700;
    }
    .topbar .sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      padding: 10px 24px 0;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: 600;
    }
    .tab-btn.active {
      color: var(--text);
      border-bottom: 2px solid var(--accent);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 24px;
      background: var(--panel);
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .filters select, .filters input {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    .filters label {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filters button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      align-self: flex-end;
    }
    .filters button.secondary {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .content {
      padding: 20px 24px 60px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .kpi-card .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    .kpi-card .value {
      font-size: 26px;
      font-weight: 700;
    }
    .kpi-card .value.green { color: var(--green); }
    .kpi-card .value.red { color: var(--red); }
    .kpi-card .value.amber { color: var(--amber); }
    .kpi-card .foot {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 30px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .note {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border-radius: var(--radius);
      overflow: hidden;
      font-size: 13px;
    }
    thead th {
      background: var(--panel2);
      color: var(--muted);
      text-align: left;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .03em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }
    .badge {
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge.ok { background: rgba(46,204,143,0.15); color: var(--green); }
    .badge.bad { background: rgba(255,93,108,0.15); color: var(--red); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { border: none; border-radius: 0; }
    .loading, .error-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .error-box { color: var(--red); }
    .hint {
      background: rgba(79,140,255,0.08);
      border: 1px solid rgba(79,140,255,0.3);
      color: #9dbdff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 18px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .pill-row { display:flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;}
    .pill {
      background: var(--panel2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <h1>Retention Team Dashboard</h1>
      <div class="sub">1 Team Leader + 5 Agents · Live from Google Sheets</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="agent">Agent-wise</button>
    <button class="tab-btn" data-tab="kpi">Agent Goal / KPI</button>
    <button class="tab-btn" data-tab="calltype">Call-Type-wise</button>
    <button class="tab-btn" data-tab="daily">Daily / Date-wise</button>
  </div>

  <div class="filters">
    <label>Reporting Period
      <select id="f-period">
        <option value="all">All / No filter</option>
        <option value="date">Specific Date</option>
        <option value="dateRange">Date Range</option>
        <option value="month">Monthly</option>
        <option value="tillDate">Till Date</option>
        <option value="quarter">Quarterly</option>
        <option value="half">Half-Yearly</option>
        <option value="annual">Annual</option>
      </select>
    </label>
    <label>Year
      <select id="f-year"><option value="">All</option></select>
    </label>
    <label id="wrap-month">Month
      <select id="f-month"><option value="">All</option></select>
    </label>
    <label id="wrap-date" style="display:none">Date
      <input type="date" id="f-date">
    </label>
    <label id="wrap-startdate" style="display:none">Start Date
      <input type="date" id="f-startdate">
    </label>
    <label id="wrap-enddate" style="display:none">End Date
      <input type="date" id="f-enddate">
    </label>
    <label id="wrap-quarter" style="display:none">Quarter
      <select id="f-quarter">
        <option value="1">Q1 (Jan-Mar)</option>
        <option value="2">Q2 (Apr-Jun)</option>
        <option value="3">Q3 (Jul-Sep)</option>
        <option value="4">Q4 (Oct-Dec)</option>
      </select>
    </label>
    <label id="wrap-half" style="display:none">Half
      <select id="f-half">
        <option value="1">H1 (Jan-Jun)</option>
        <option value="2">H2 (Jul-Dec)</option>
      </select>
    </label>
    <label>Agent
      <select id="f-agent"><option value="">All Agents</option></select>
    </label>
    <label>Call Type
      <select id="f-calltype">
        <option value="">All</option>
        <option value="Inactive">Inactive</option>
        <option value="Upcoming">Upcoming</option>
        <option value="Suspended">Suspended</option>
      </select>
    </label>
    <button onclick="applyFilters()">Apply Filters</button>
    <button class="secondary" onclick="resetFilters()">Reset</button>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading dashboard data…</div>
  </div>

  <script>
    // ---- CONFIG ----
    // Your deployed Apps Script Web App URL (must end in /exec)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykWLh7a3LmuTZJMjw6ZJZLgxPz1jvwSBnY23CO9zl9WLcaO9g_sqZ_a7UFiZUuHZ4AAg/exec";

    let dashboardData = null;
    let currentTab = 'overview';

    function callAppsScript(action, params) {
      params = params || {};
      const url = new URL(APPS_SCRIPT_URL);
      url.searchParams.set('action', action);
      Object.keys(params).forEach(k => {
        if (params[k] !== undefined && params[k] !== null && params[k] !== '') {
          url.searchParams.set(k, params[k]);
        }
      });
      return fetch(url.toString()).then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        render();
      });
    });

    document.getElementById('f-period').addEventListener('change', (e) => {
      const p = e.target.value;
      document.getElementById('wrap-date').style.display = (p === 'date') ? 'flex' : 'none';
      document.getElementById('wrap-startdate').style.display = (p === 'dateRange') ? 'flex' : 'none';
      document.getElementById('wrap-enddate').style.display = (p === 'dateRange') ? 'flex' : 'none';
      document.getElementById('wrap-quarter').style.display = (p === 'quarter') ? 'flex' : 'none';
      document.getElementById('wrap-half').style.display = (p === 'half') ? 'flex' : 'none';
      document.getElementById('wrap-month').style.display = (p === 'month' || p === 'tillDate') ? 'flex' : 'none';
    });

    function loadFilterOptions() {
      callAppsScript('getFilterOptions').then(opts => {
        if (!opts.success) return;
        const yearSel = document.getElementById('f-year');
        opts.years.forEach(y => {
          const o = document.createElement('option');
          o.value = y; o.textContent = y;
          yearSel.appendChild(o);
        });
        const monthSel = document.getElementById('f-month');
        opts.months.forEach(m => {
          const o = document.createElement('option');
          o.value = m; o.textContent = m;
          monthSel.appendChild(o);
        });
        const agentSel = document.getElementById('f-agent');
        opts.agents.forEach(a => {
          const o = document.createElement('option');
          o.value = a; o.textContent = a;
          agentSel.appendChild(o);
        });
      }).catch(err => {
        console.error('Failed to load filter options', err);
      });
    }

    function buildFilterPayload() {
      const period = document.getElementById('f-period').value;
      const filters = {
        periodType: period === 'all' ? '' : period,
        year: document.getElementById('f-year').value,
        month: document.getElementById('f-month').value,
        date: document.getElementById('f-date').value,
        startDate: document.getElementById('f-startdate').value,
        endDate: document.getElementById('f-enddate').value,
        quarter: document.getElementById('f-quarter').value,
        half: document.getElementById('f-half').value,
        agent: document.getElementById('f-agent').value,
        callType: document.getElementById('f-calltype').value
      };
      return filters;
    }

    function applyFilters() {
      loadData(buildFilterPayload());
    }

    function resetFilters() {
      document.getElementById('f-period').value = 'all';
      document.getElementById('f-year').value = '';
      document.getElementById('f-month').value = '';
      document.getElementById('f-date').value = '';
      document.getElementById('f-startdate').value = '';
      document.getElementById('f-enddate').value = '';
      document.getElementById('f-agent').value = '';
      document.getElementById('f-calltype').value = '';
      document.getElementById('f-period').dispatchEvent(new Event('change'));
      loadData({});
    }

    function loadData(filters) {
      document.getElementById('content').innerHTML = '<div class="loading">Loading dashboard data…</div>';
      callAppsScript('getDashboardData', filters)
        .then(data => {
          if (!data.success) {
            document.getElementById('content').innerHTML =
              '<div class="error-box">Error loading data: ' + data.error + '</div>';
            return;
          }
          dashboardData = data;
          render();
        })
        .catch(err => {
          document.getElementById('content').innerHTML =
            '<div class="error-box">Failed to reach the dashboard backend: ' + err.message +
            '<br><br>Check that APPS_SCRIPT_URL in this file matches your deployed Apps Script Web App /exec URL, and that the deployment access is set to "Anyone".</div>';
        });
    }

    function statusBadge(status) {
      if (status === 'N/A') {
        return '<span class="badge" style="background:rgba(139,149,171,0.15);color:var(--muted)">N/A</span>';
      }
      const cls = status === 'Achieved' ? 'ok' : 'bad';
      return '<span class="badge ' + cls + '">' + status + '</span>';
    }

    function render() {
      if (!dashboardData) return;
      const c = document.getElementById('content');
      if (currentTab === 'overview') c.innerHTML = renderOverview();
      else if (currentTab === 'agent') c.innerHTML = renderAgentWise();
      else if (currentTab === 'kpi') c.innerHTML = renderKpi();
      else if (currentTab === 'calltype') c.innerHTML = renderCallType();
      else if (currentTab === 'daily') c.innerHTML = renderDaily();
    }

    function renderOverview() {
      const o = dashboardData.overview;
      return `
        <div class="hint">PRI-wise Call Count (total attempts) is always shown separately from Call Sheet-wise Unique Customer Count — they are never combined.</div>
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="label">Total Call Attempts (PRI-wise)</div>
            <div class="value">${o.priCallCount}</div>
          </div>
          <div class="kpi-card">
            <div class="label">Total Unique Customers Called</div>
            <div class="value">${o.uniqueCustomers}</div>
          </div>
          <div class="kpi-card">
            <div class="label">Contactable Customers</div>
            <div class="value">${o.contactableCount}</div>
          </div>
          <div class="kpi-card">
            <div class="label">Contactable %</div>
            <div class="value ${o.contactablePct >= 55 ? 'green' : 'red'}">${o.contactablePct}%</div>
            <div class="foot">Target ≥55%</div>
          </div>
          <div class="kpi-card">
            <div class="label">Active Customers</div>
            <div class="value">${o.activeCount}</div>
          </div>
          <div class="kpi-card">
            <div class="label">Active %</div>
            <div class="value ${o.activePct >= 55 ? 'green' : 'red'}">${o.activePct}%</div>
            <div class="foot">Target ≥55%</div>
          </div>
          <div class="kpi-card">
            <div class="label">Call Mgmt Target</div>
            <div class="value">${o.callManagementTarget}</div>
          </div>
          <div class="kpi-card">
            <div class="label">Call Mgmt Achievement</div>
            <div class="value ${o.callManagementAchievement >= o.callManagementTarget ? 'green':'amber'}">${o.callManagementAchievement}</div>
          </div>
          <div class="kpi-card">
            <div class="label">Call Mgmt Target Shortfall</div>
            <div class="value ${o.callManagementShortfall > 0 ? 'red':'green'}">${o.callManagementShortfall}</div>
          </div>
          <div class="kpi-card">
            <div class="label">LBO Shifted to Other ISP</div>
            <div class="value amber">${o.lboShiftedCount}</div>
            <div class="foot">Neutral — excluded from Active/Inactive</div>
          </div>
        </div>
      `;
    }

    function renderAgentWise() {
      const rows = dashboardData.agentWise.map(a => `
        <tr>
          <td>${a.agent}</td>
          <td>${a.priCallCount}</td>
          <td>${a.uniqueCustomers}</td>
          <td>${a.contactableCount}</td>
          <td>${a.contactablePct}%</td>
          <td>${a.activeCount}</td>
          <td>${a.activePct}%</td>
          <td>${a.callTarget}</td>
          <td>${a.callAchievement}</td>
          <td>${a.targetShortfall}</td>
          <td>${statusBadge(a.callStatus)}</td>
        </tr>
      `).join('');
      return `
        <div class="section-title">Agent-wise Performance <span class="note">PRI-wise Call Count ≠ Unique Customer Count</span></div>
        <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Agent</th><th>PRI Call Count</th><th>Unique Customers</th>
            <th>Contactable</th><th>Contactable %</th><th>Active</th><th>Active %</th>
            <th>Call Target</th><th>Achievement</th><th>Shortfall</th><th>Status</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="11">No data for selected filters</td></tr>'}</tbody>
        </table>
        </div>
      `;
    }

    function renderKpi() {
      const rows = dashboardData.kpiPerformance.map(k => `
        <tr>
          <td>${k.kra}</td>
          <td>${k.target}</td>
          <td>${k.achievement}</td>
          <td>${k.shortfall}</td>
          <td>${statusBadge(k.status)}</td>
        </tr>
      `).join('');
      return `
        <div class="section-title">Agent Goal / KPI Performance</div>
        <div class="table-wrap">
        <table>
          <thead><tr><th>KRA</th><th>Target</th><th>Achievement</th><th>Shortfall</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
      `;
    }

    function renderCallType() {
      const rows = dashboardData.callTypeWise.map(ct => `
        <tr>
          <td>${ct.callType}</td>
          <td>${ct.uniqueCustomers}</td>
          <td>${ct.contactableCount}</td>
          <td>${ct.contactablePct}%</td>
          <td>${ct.activeCount}</td>
          <td>${ct.activePct}%</td>
        </tr>
      `).join('');
      return `
        <div class="section-title">Call-Type-wise Performance</div>
        <div class="table-wrap">
        <table>
          <thead><tr><th>Call Type</th><th>Unique Customers</th><th>Contactable</th><th>Contactable %</th><th>Active</th><th>Active %</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6">No data</td></tr>'}</tbody>
        </table>
        </div>
      `;
    }

    function renderDaily() {
      const rows = dashboardData.dailyPerformance.map(d => `
        <tr>
          <td>${d.date}</td>
          <td>${d.uniqueCustomers}</td>
          <td>${d.contactableCount}</td>
          <td>${d.contactablePct}%</td>
          <td>${d.activeCount}</td>
          <td>${d.activePct}%</td>
        </tr>
      `).join('');
      return `
        <div class="section-title">Daily / Date-wise Performance</div>
        <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Unique Customers</th><th>Contactable</th><th>Contactable %</th><th>Active</th><th>Active %</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6">No date-stamped data for this range</td></tr>'}</tbody>
        </table>
        </div>
      `;
    }

    // init
    loadFilterOptions();
    loadData({});
  </script>
</body>
</html>
